<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interval Trainer</title>
<link rel="stylesheet" type="text/css" href="styles.css">

</head>
<body>

<div class="app">

    <h1>Interval Trainer</h1>

    <!-- <div class="subtitle">
        Brutally educational. Like jazz school, but cheaper.
    </div> -->

    <!-- QUESTION CARD -->

    <div class="card">

        <div class="question" id="question">
            Press <strong>Start Game</strong> to begin.
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="note-grid">

            <div class="note-row" id="flatRow"></div>
            <div class="note-row" id="naturalRow"></div>
            <div class="note-row" id="sharpRow"></div>

        </div>

    </div>

    <!-- GAME STATS -->

    <div class="card">

        <h2>Game Stats</h2>

        <div class="game-buttons">
            <button class="primary" id="startGame">Start Game</button>
            <button id="pauseGame">Pause Timer</button>
            <button id="resetGame">Reset</button>
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="correctCount">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Incorrect</div>
                <div class="stat-value" id="incorrectCount">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Accuracy</div>
                <div class="stat-value" id="accuracy">0%</div>
            </div>

            <div class="stat">
                <div class="stat-label">Current Time</div>
                <div class="stat-value" id="timer">00:00</div>
            </div>

            <div class="stat">
                <div class="stat-label">Average Time</div>
                <div class="stat-value" id="averageTime">00:00</div>
            </div>

        </div>

    </div>

    <!-- FILTERS -->

    <div class="card">

        <h2>Interval Filters</h2>

        <div class="controls">
            <button id="selectAll">Select All</button>
            <button id="deselectAll">Deselect All</button>
        </div>

        <div class="interval-grid" id="intervalGrid"></div>

        <div class="direction-row">
            <button class="direction-btn active" data-direction="above">Above</button>
            <button class="direction-btn" data-direction="below">Below</button>
            <button class="direction-btn" data-direction="both">Both</button>
        </div>

        <div class="warning" id="warning"></div>

    </div>

</div>

<script type="text/javascript" src="script.js"></script>

</body>
</html>
